$schema: "https://json-schema.org/draft/2020-12/schema"
description: kairos-lr configuration
type: object
properties:
  catalogue:       {type: string, description: dereplicated contig catalogue (FASTA)}
  catalogue_name:  {type: string, pattern: "^[A-Za-z0-9_-]+$", default: catalogue}
  samples:         {type: [string, "null"], default: ""}
  gtdb_db:         {type: string}
  ripdb:           {type: [string, "null"], default: ""}
  mobileog:        {type: [string, "null"], default: ""}
  card:            {type: [string, "null"], default: ""}
  scripts_dir:     {type: string}
  threads:         {type: integer, minimum: 1, default: 4}
  min_seq_id:      {type: number, minimum: 0, maximum: 1, default: 0.99}
  min_cov:         {type: number, minimum: 0, maximum: 1, default: 0.8}
  cluster_method:  {type: string, enum: [easy-cluster, easy-linclust], default: easy-cluster}
  mmseqs_split_memory: {type: [string, "null"], default: ""}
  minlen:          {type: integer, minimum: 0, default: 1000}
  min_contig_orfs: {type: integer, minimum: 1, default: 3}
  merge_distance:  {type: integer, minimum: 0, default: 1000}
  edge_padding:    {type: integer, minimum: 0, default: 1000}
  slop:            {type: integer, minimum: 0, default: 1000}
  features:
    type: object
    properties:
      window:         {type: integer, minimum: 0}
      min_identity:   {type: number, minimum: 0, maximum: 1}
      min_flank:      {type: integer, minimum: 0}
      flank_len:      {type: integer, minimum: 1}
      junction_flank: {type: integer, minimum: 1}
      snap:           {type: integer, minimum: 0}
    required: [window, min_identity, min_flank, flank_len, junction_flank, snap]
  assess:
    type: object
    properties:
      short_aligner:     {type: string, enum: [strobealign, bwa-mem2]}
      short_read_length: {type: integer, minimum: 30}
      long_read_presets: {type: object, additionalProperties: {type: string}}
      min_mapq:          {type: integer, minimum: 0}
      junction_min_mapq: {type: integer, minimum: 0}
      overhang:
        type: object
        properties:
          short: {type: integer, minimum: 1}
          long:  {type: integer, minimum: 1}
        required: [short, long]
      max_insert:        {type: integer, minimum: 1}
      empty_tolerance:   {type: integer, minimum: 0}
      second_pass:       {type: boolean}
    required: [short_aligner, short_read_length, long_read_presets, min_mapq, junction_min_mapq, overhang, max_insert, empty_tolerance, second_pass]
  call:
    type: object
    properties:
      min_reads:          {type: integer, minimum: 1}
      alpha:              {type: number, exclusiveMinimum: 0, maximum: 1}
      absent_fraction:    {type: number, exclusiveMinimum: 0, maximum: 1}
      observed_fractions: {type: array, items: {type: string}}
      prior_fractions:    {type: array, items: {type: string}}
      use_taxonomy:       {type: boolean}
    required: [min_reads, alpha, absent_fraction, observed_fractions, prior_fractions, use_taxonomy]
  annotation:
    type: object
    additionalProperties:
      type: object
      properties:
        id: {type: number}
        qc: {type: number}
        sc: {type: number}
      required: [id, qc, sc]
  wf_version:      {type: string}
required: [catalogue, gtdb_db, features, assess, call, annotation]
