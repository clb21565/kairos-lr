# ─────────────────────────────────────────────────────────────────────────────
# kairos-lr config
#
# Fill in the catalogue, the sample sheet (for assess) and the database paths,
# then run, e.g.
#   snakemake --use-conda -j 4                         # locally
#   snakemake --profile profiles/slurm                 # on SLURM
# Any key can be overridden on the command line with --config key=value.
# ─────────────────────────────────────────────────────────────────────────────


# ── Input ────────────────────────────────────────────────────────────────────
# One dereplicated contig catalogue (FASTA), built beforehand: ideally the long-read
# assemblies of the study, contigs prefixed with their assembly ID and dereplicated
# at 99%. Contig names must be unique and must not contain spaces.
catalogue: catalogue.fa
# Name used for the detect outputs: results/detect/<catalogue_name>.*
catalogue_name: catalogue

# Sample sheet (TSV) for assess / call; see config/samples.example.tsv.
# Leave empty to run detect only.
samples: ""


# ── Reference databases ─────────────────────────────────────────────────────
# mmseqs-formatted GTDB database (required), used for taxonomic assignment of
# contigs and candidate HGT regions. Build with `mmseqs databases GTDB <out> <tmp>`.
gtdb_db: /projects/MA/HGT/gtdb_v232/gtdb

# Protein FASTA / diamond databases for annotation (optional: leave empty to skip).
# RIP (replication initiation protein) database, used for plasmid typing.
ripdb: /home/bio.aau.dk/se70ol/databases/nine_reps/ripdb.faa
# mobileOG-db (mobile genetic element ontology).
mobileog: ""
# CARD (Comprehensive Antibiotic Resistance Database) protein homolog models.
card: /home/bio.aau.dk/se70ol/databases/card/protein_fasta_protein_homolog_model.fasta


# ── Scripts ──────────────────────────────────────────────────────────────────
# By default the scripts shipped in scripts/ next to the Snakefile are used.
# scripts_dir: /path/to/dev-scripts/


# ── General parameters ───────────────────────────────────────────────────────
threads: 4
sort_mem_mb: 1024   # samtools sort memory per thread in align (up to 4 sort threads)


# ── ORF clustering (mmseqs easy-cluster) ────────────────────────────────────
min_seq_id: 0.99   # minimum sequence identity for clustering
min_cov: 0.8       # minimum query coverage for clustering
minlen: 1000       # minimum ORF/region length considered
cluster_method: easy-cluster   # or easy-linclust (much less memory; near-identical clusters at 99% identity)
mmseqs_split_memory: ""   # e.g. 2G; passed as --split-memory-limit when set (small machines)


# ── HGT region detection ─────────────────────────────────────────────────────
# min_contig_orfs: contigs with fewer ORFs are not used by derep-detect
min_contig_orfs: 3
# merge_distance: candidate HGT ORFs closer than this (bp) are merged into one region
merge_distance: 1000
# edge_padding: regions within this distance (bp) of a contig end are edge regions
edge_padding: 1000
# slop: extra bp either side of a region when extracting its sequence for taxonomy
slop: 1000


# ── Junction features (build_features.py) ───────────────────────────────────
# Each pair of shared regions is aligned to find where the shared sequence really
# ends; the breakpoints, their flanks and the empty sites are what assess counts.
features:
  window: 5000          # bp either side of each region included in the pairwise alignment
  min_identity: 0.95    # minimum identity of the aligned shared segment
  min_flank: 200        # less own sequence than this beyond a breakpoint = contig end (no breakpoint)
  flank_len: 1000       # own sequence next to each breakpoint used for flank depth
  junction_flank: 500   # bp either side of the junction in junction windows / empty-site sequences
  snap: 10              # breakpoints closer than this on the same contig are merged


# ── Assess: read mapping and counting (count_features.py) ───────────────────
assess:
  short_aligner: strobealign      # or bwa-mem2
  short_read_length: 150          # strobealign index is built for this read length
  long_read_presets:              # minimap2 -x preset per long read_type
    ont: map-ont                  # lr:hq for recent high-accuracy ONT (R10.4, Q20+)
    hifi: map-hifi
  min_mapq: 20                    # flank depth and contig coverage
  junction_min_mapq: 1            # junction reads/pairs: only ties (MAPQ 0) are excluded, because
                                  # reads partly in shared sequence get modest MAPQ even when placed right
  overhang:                       # aligned bp needed on each side of a junction
    short: 25
    long: 100
  max_insert: 1000                # largest insert for a bridging read pair
  empty_tolerance: 50             # bp an alignment break may sit from the empty-site junction
  second_pass: true               # short reads: realign clipped/unmapped reads near segment ends to
                                  # the empty-site sequences (split-read evidence for strobealign)


# ── Call: detection states and in situ events ───────────────────────────────
# Samples with the same group, timepoint and fraction are pooled into one observation.
call:
  min_reads: 2              # junction reads to call a segment present (k)
  alpha: 0.05               # absent if P(fewer than k reads | carried) <= alpha
  absent_fraction: 1.0      # carrier fraction an absent call rules out (1.0 = whole host population)
  observed_fractions: []    # fractions where recipients are looked for (empty = all), e.g. [INF]
  prior_fractions: []       # fractions that count as having seen a contig (empty = all), e.g. [INF, EFF]
  use_taxonomy: true        # add contig lineages and the discordant rank to in situ events (needs GTDB)


# ── Functional annotation thresholds ────────────────────────────────────────
# Passed to `diamond blastp --id / --query-cover / --subject-cover`.
annotation:
  ripdb:    {id: 20, qc: 80, sc: 80}
  mobileog: {id: 20, qc: 80, sc: 80}
  card:     {id: 90, qc: 50, sc: 50}


# ── Workflow metadata ────────────────────────────────────────────────────────
wf_version: "0.2.0-dev"
