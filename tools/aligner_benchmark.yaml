# conda env for tools/aligner_benchmark.py (tier 3, docs/testing.md)
#   conda env create -f tools/aligner_benchmark.yaml
name: kairos-bench
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - pandas>=2.2
  - pysam>=0.22
  - mappy>=2.26
  - strobealign>=0.14
  - bwa-mem2=2.2
  - bowtie2>=2.5
  - samtools=1.21
  - wgsim
