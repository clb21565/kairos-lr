# conda env for the long-read SV comparison (tools/sv_compare.py, slurm/sv_compare.sbatch)
#   conda env create -f tools/sv_compare.yaml
name: kairos-sv
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - pandas>=2.2
  - pysam>=0.22
  - sniffles>=2.4
  - minimap2>=2.28
  - samtools=1.21
