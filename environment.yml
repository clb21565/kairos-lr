# Launcher environment: Snakemake itself. The tools each rule needs are installed
# automatically from workflow/envs/*.yaml when run with --use-conda (or the slurm profile).
name: kairos-lr
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - snakemake>=9.9
  - snakemake-executor-plugin-slurm
  - pandas
  - wgsim            # only for the simulated test data (.tests/make_sim_data.py)
